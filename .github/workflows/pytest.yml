name: Shopping cart unit tests

on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/pytest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest==8.4.2
      - name: Run unit tests
        run: python -m pytest -v
